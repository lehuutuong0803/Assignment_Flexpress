# Local development stack. `docker compose up` must work from a fresh clone with no manual steps,
# (see DEPLOYMENT.md); nothing here is used in production.
name: flexpress

# Settings shared by the app and its one-shot migration job (same image, same config).
# Containers reach dependencies by service name; the issuer and presigned URLs use localhost
# because that's what clients on the host see.
x-app-environment: &app-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-delivery}
  DB_USER: ${DB_USER:-delivery}
  DB_PASSWORD: ${DB_PASSWORD:-dev-only-db-password}
  KEYCLOAK_ISSUER: http://localhost:8080/realms/flexpress
  KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/flexpress/protocol/openid-connect/certs
  KEYCLOAK_AUDIENCE: delivery-service
  S3_BUCKET: ${S3_BUCKET:-flexpress-pod}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-dev-only-minio-user}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dev-only-minio-password}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-delivery}
      POSTGRES_USER: ${DB_USER:-delivery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-db-password}
    ports:
      - "127.0.0.1:5432:5432" # local only, for running the service with `npm run start:dev`
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    # start-dev uses an embedded H2 database; the realm is re-imported on a fresh container.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-dev-only-admin-password}
      # Tokens carry the public issuer (what clients on the host see), while containers can still
      # reach Keycloak at http://keycloak:8080 (backchannel) to fetch the JWKS.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port (9000).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dev-only-minio-user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dev-only-minio-password}
    ports:
      - "127.0.0.1:9000:9000" # S3 API: presigned URLs are used from the host
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the proof-of-delivery bucket, then exits 0. Safe to re-run.
  minio-init:
    image: amazon/aws-cli:2.37.12
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-dev-only-minio-user}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dev-only-minio-password}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-flexpress-pod}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null
        || aws s3api create-bucket --bucket "$${S3_BUCKET}"
    restart: "no"

  # One-shot job: applies pending migrations with the app image (compiled JS, plain node), then
  # exits 0. Re-running is a no-op. The app only starts after it succeeds.
  migrate:
    # Same image as delivery-service, which builds it (Compose builds before creating containers).
    # Only one service builds: two parallel builds of the same tag collide.
    image: delivery-service:local
    pull_policy: never
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/database/data-source.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true # short-lived job; the image's HTTP health check doesn't apply
    restart: "no"

  delivery-service:
    build: ./delivery-service
    image: delivery-service:local
    # Always build from the Dockerfile (layer cache makes it ~1-2 s when nothing changed): never tries
    # to pull this local tag, and code changes are always picked up without --build.
    pull_policy: build
    environment: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Health check comes from the Dockerfile (GET /health).

volumes:
  postgres-data:
  minio-data:
