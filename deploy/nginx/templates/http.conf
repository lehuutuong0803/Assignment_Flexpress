# Port 80 before a certificate exists: Let's Encrypt challenge + plain HTTP proxying, so the very
# first deploy works and certbot can validate the hostnames.
server {
  listen 80 default_server;
  server_name __API_HOST__ __AUTH_HOST__;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Prometheus scrapes from the private network only; never expose metrics publicly.
  location = /metrics {
    return 404;
  }

  location / {
    include /etc/nginx/flexpress/active-upstream.conf;
    if ($host = __AUTH_HOST__) {
      set $backend http://keycloak:8080;
    }
    proxy_pass $backend;
  }
}
