# Used once a certificate exists: port 80 only answers ACME challenges and redirects to HTTPS.
server {
  listen 80 default_server;
  server_name __API_HOST__ __AUTH_HOST__;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# API
server {
  listen 443 ssl;
  http2 on;
  server_name __API_HOST__;

  ssl_certificate /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Prometheus scrapes from the private network only; never expose metrics publicly.
  location = /metrics {
    return 404;
  }

  location / {
    include /etc/nginx/flexpress/active-upstream.conf;
    proxy_pass $backend;
  }
}

# Keycloak (token issuer: https://__AUTH_HOST__/realms/flexpress)
server {
  listen 443 ssl;
  http2 on;
  server_name __AUTH_HOST__;

  ssl_certificate /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_buffer_size 128k; # Keycloak sends large headers (cookies, redirects)
    proxy_buffers 4 256k;
  }
}
