worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # Docker's DNS: upstreams are resolved per request, so nginx starts even when an app color or
  # Keycloak isn't running yet, and a blue/green switch only needs a reload.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Keep the client's X-Request-Id or generate one; it's forwarded to the API, which echoes it
  # and puts it on every log line, so nginx and app logs can be joined.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id",'
    '"remote_addr":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  client_max_body_size 1m; # API bodies are small; photos go straight to S3
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Request-Id $req_id;

  # Generated by deploy.sh from ./templates (HTTP-only until a certificate exists, then HTTPS).
  include /etc/nginx/flexpress/sites/*.conf;
}
